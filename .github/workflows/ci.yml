name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: docs/requirements.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      # ScaffoldGuard 0.1.2 expects the generated TypeScript CI token `npm install`;
      # this repository executes `npm ci` because package-lock.json is committed.
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
      - run: npm run build
      - run: npm run validate:v1-local

      - run: npm run coverage

      - run: uv python install 3.13
      - run: uv venv --python 3.13
      - run: uv pip sync --python .venv/bin/python --require-hashes docs/requirements.lock
      - run: .venv/bin/mkdocs build --strict

      - run: uv tool install scaffold-guard
      - run: scaffold-guard check
